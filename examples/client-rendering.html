<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client-rendered Clio Markdown</title>
<script src="/assets/clio-markdown.js"></script>
<main>
  <h1>Markdown report</h1>
  <div id="report">Loading report…</div>
</main>
<script>
  fetch('/api/v1/default/files?path=%2Fexamples%2Freport.md')
    .then(response => {
      if (!response.ok) throw new Error('Could not resolve the Markdown entry');
      return response.json();
    })
    .then(entry => fetch('/api/v1/default/files/' + encodeURIComponent(entry.id) + '/content'))
    .then(response => {
      if (!response.ok) throw new Error('Could not load the Markdown source');
      return response.text();
    })
    .then(source => {
      document.querySelector('#report').innerHTML = ClioMarkdown.render(source);
    })
    .catch(error => {
      document.querySelector('#report').textContent = error.message;
    });
</script>
</html>
