name: Release

# Publish a GitHub release for a version tag using the matching CHANGELOG
# section as the notes. Source archives are attached automatically by GitHub.
#
# Run manually from the Actions tab to publish a release for a tag that already
# exists (for example v1.0.0 or v1.0.1).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish a release for (for example v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          tag="${{ github.event.inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="$GITHUB_REF_NAME"
          fi
          case "$tag" in
            v[0-9]*) ;;
            *) echo "Tag must look like v1.2.3, got: $tag" >&2; exit 1 ;;
          esac
          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.value }}

      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          version="${TAG#v}"
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { capture = 1; next }
            capture && index($0, "## [") == 1 { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for $TAG; using a placeholder." >&2
            echo "Release $TAG. See CHANGELOG.md for details." > release-notes.md
          fi
          echo "--- release notes ---"
          cat release-notes.md

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
          fi
