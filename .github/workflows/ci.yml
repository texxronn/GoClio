name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      # The SQLite FTS5 index (SPEC.md section 64.6) requires the
      # sqlite_fts5 build tag; the Makefile applies it to test, vet and build.
      - name: Test, vet and build
        run: make check
